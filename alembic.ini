# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = database/alembic

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file as well as the filename.
# string_id_fields = false

# max length of characters to use for "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow reading version of the raws from
# variables in the environment
# version_locations = %(here)s/bar

# version path separator; as of Alembic 1.11, default is os.pathsep
# version_path_separator = :

# set to 'true' to search for scripts in subdirectories of script_location
# recursive_version_locations = false

# logging configuration is at the end of the file.
sqlalchemy.url = postgresql+asyncpg://postgres:postgrespassword@localhost:5432/traceiq

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
